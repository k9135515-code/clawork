[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "bin/clawork-cli",
  "crates/clawork-core",
  "crates/clawork-capabilities",
  "crates/clawork-fs",
  "crates/clawork-browser",
  "crates/clawork-office",
  "crates/clawork-daemon",
  "crates/clawork-skills",
  "crates/clawork-adapters",
  "crates/clawork-memory",
  "crates/clawork-audit",
  "crates/clawork-mcp-client",
  "crates/clawork-llm",
  "crates/clawork-operator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/example/clawork"

[workspace.dependencies]
anyhow = "1.0.97"
async-trait = "0.1.88"
axum = { version = "0.8.1", features = ["json"] }
chrono = { version = "0.4.40", features = ["serde"] }
clap = { version = "4.5.32", features = ["derive", "env"] }
hex = "0.4.3"
hmac = "0.12.1"
notify = "6.1.1"
parking_lot = "0.12.3"
reqwest = { version = "0.12.14", default-features = false, features = ["json", "rustls-tls"] }
rust_xlsxwriter = "0.79.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
sqlx = { version = "0.8.3", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json"] }
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "net"] }
tokio-cron-scheduler = "0.13.0"
cron = "0.12.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
url = "2.5.4"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
wasmtime = "25.0.3"
wasmtime-wasi = "25.0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
